name: Weekly Article Generation

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npx tsx pipelines/auto-reportasje/run-pipeline.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_APP_ID: ${{ vars.APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit topics-used.json
        run: |
          git config user.name "individet-bot"
          git config user.email "bot@individet.no"
          git add pipelines/auto-reportasje/topics-used.json
          git diff --staged --quiet || git commit -m "chore: legg til brukt emne etter artikkelgenerering"
          git push
